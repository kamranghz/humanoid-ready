# Evidence-locked completion, ablation study — oracle-evidence completion (control path; docs/evidence_locked_ablation.md).
# Same evidence schema, splits, windows, cohorts and metrics as the oracle baselines (read from baseline_config).
baseline_config: configs/oracle_completion_baselines.yaml
seed: 0

disclaimer: >-
  oracle control; floor height given (world z = 0); head pose and gravity given (rig input)

occlusion_cache:
  rel_dir: self_occlusion_30hz
  build_workers: 24
  verify_n_clips: 40
  verify_n_train_items: 64

model:
  d_model: 256
  n_heads: 8
  n_layers: 4      # evidence encoder
  dec_layers: 4
  post_layers: 2
  ff_dim: 1024
  dropout: 0.1
  max_len: 64
  latent_dim: 32
  generative: true

# Evidence lock: J + smooth_t(vis*(obs - J)) / (smooth_t(vis) + kappa); null disables (ablation).
lock:
  sigma_frames: 1.5
  radius_frames: 4
  kappa: 0.05

loss:
  w_geodesic: 1.0
  w_transl: 1.0
  w_joints: 2.0
  w_contact: 0.3
  beta_kl: 0.001
  w_phys: 0.0
  phys_terms:            # used only when w_phys > 0
    penetration: 100.0   # squared hinge below the floor (m^2) on sole-proxy foot channels
    skate: 1.0           # contact-weighted squared horizontal foot speed (GT contact labels)
    balance: 1.0         # CoM-to-support-polygon distance (m)
    balance_frames_per_step: 16

train:
  batch_size: 64
  lr: 4.0e-4
  weight_decay: 0.01
  warmup_steps: 2000
  grad_clip: 1.0
  bf16: true
  num_workers: 16
  log_every: 500
  val_every: 5000
  checkpoint_root: null  # default <data_root>/checkpoints/evidence_locked_ablation

# Ablations: one factor changed from the reference row, identical budget.
ablation:
  max_steps: 40000   # = oracle-transformer training budget
  runs:
    ref_locked_gen_phys0: {}
    unlocked: {lock: null}
    deterministic: {model: {generative: false}}
    phys: {loss: {w_phys: 1.0}}

# Main run: locked + generative, longer schedule. w_phys rule pre-registered before any ablation result:
# use the "phys" arm's w_phys if, on VAL all, its penetration and skate are not worse than the
# reference and its full MPJPE is at most +1.0 mm worse; otherwise w_phys = 0.
main:
  max_steps: 150000
  w_phys_rule_max_mpjpe_increase_mm: 1.0

generative_check:
  n_samples: 8
  n_clips: 50

preflight:
  overfit_steps: 300
  resume_steps: 20
  benchmark_steps: 100

paths:
  results_json: results/completion/evidence_locked_ablation.json
