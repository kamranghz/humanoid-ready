# Copy to configs/paths.yaml (git-ignored) and adjust if needed.
# All assets in AGENTS.md §1 live under data_root.

data_root: /path/to/hready_data
amass_root: /path/to/hready_data/datasets/amass/smplx_n
cache_dir: /path/to/hready_data/cache
babel_root: /path/to/hready_data/datasets/babel/babel_v1.0_release

# GMR retargeting (third-party MIT; subprocess only — see hready/robot/retarget.py)
gmr_root: /path/to/third_party/GMR
gmr_python: /path/to/envs/hready-gmr/python

# Isaac Lab + Newton (WSL only — item 6C; Windows hready launches via files)
isaaclab_root: /path/to/IsaacLab-Newton
wsl_python: /path/to/isaaclab-newton-env/bin/python

