# Track E1: reproducible split summary + floor-work evaluation (paths via paths.yaml).
paths_config: configs/paths.yaml

seed: 0
fps: 30.0

cohorts:
  floor_work_babel_keywords:
    kneel: "kneel"
    sit: "sit"
    lie: "lie"
    crawl: "crawl"
    yoga: "yoga"
  ordinary_locomotion_babel_keywords:
    walk: "walk"
    run: "run"
    stand: "stand"
    turn: "turn"
  other_labelled_babel_keywords:
    crouch: "crouch"
    stretch: "stretch"

# Oct 2026 overlapping rules (wrong joint indices in P1); used only for acceptance recount.
legacy_geometry:
  lie:
    pelvis_z_max: 0.55
    torso_up_dot_max: 0.45
  sit:
    pelvis_z_min: 0.28
    pelvis_z_max: 0.88
    torso_up_dot_min: 0.62
  kneel:
    pelvis_z_max: 0.62
    torso_up_dot_min: 0.5
  crawl:
    pelvis_z_max: 0.5
    wrist_z_max: 0.38
  yoga:
    pelvis_z_max: 0.75
    torso_up_dot_min: 0.35
  crouch:
    pelvis_z_max: 0.7
    torso_up_dot_min: 0.4

legacy_acceptance_keywords:
  kneel: "kneel"
  sit: "sit"
  lie: "lie"
  crawl: "crawl"
  yoga: "yoga"
  crouch: "crouch"
  stretch: "stretch"

floor_work:
  min_segment_duration_s: 1.0
  min_geometry_fraction: 0.5
  geometry_tree:
    frozen_date: "2026-10-04"
    use_normalized_height: false
    height_unit: metres
    cv_ordinary_loco_pelvis_raw: 0.089
    cv_ordinary_loco_pelvis_norm: 0.112
    thresholds:
      torso_horizontal_max: 0.45
      torso_upright_min: 0.82
      crawl_pelvis_h_max: 0.42
      crawl_wrist_h_max: 0.22
      crawl_shoulder_h_min: 0.30
      lie_pelvis_h_max: 0.40
      lie_shoulder_h_max: 0.30
      kneel_thigh_up_max: -0.42
      kneel_pelvis_h_max: 0.58
      sit_thigh_up_min: -0.32
      sit_support_pelvis_h_min: 0.43
      yoga_pelvis_h_max: 0.55
      yoga_torso_up_min: 0.30
    threshold_provenance:
      torso_horizontal_max:
        type: anchor
        note: torso angle ~63 deg from +Z
      torso_upright_min:
        type: anchor
        note: upright trunk for sit/kneel
      crawl_pelvis_h_max:
        type: anchor
        note: low pelvis metres grounded clip
      crawl_wrist_h_max:
        type: anchor
        note: hands near floor
      crawl_shoulder_h_min:
        type: policy
        note: >-
          Policy value (not a valley; no derived physical anchor). Reference label-free
          horiz+low-pelvis pool (all VAL, stride 4): q55=0.280 m; mode in [0.25, 0.30).
          Only splits lie vs crawl in the horizontal band; lie/crawl counts and BABEL
          lie/crawl confirmation depend on it; sensitivity not measured.
      lie_pelvis_h_max:
        type: anchor
        note: floor supine pelvis; above is raised_support_not_floor
      lie_shoulder_h_max:
        type: policy
        note: same policy value as crawl_shoulder_h_min (lie trunk at or below split)
      kneel_thigh_up_max:
        type: anchor
        note: thigh axis nearer vertical than sit
      kneel_pelvis_h_max:
        type: anchor
        note: low pelvis knees down
      sit_thigh_up_min:
        type: anchor
        note: thigh axis nearer horizontal
      sit_support_pelvis_h_min:
        type: midpoint_percentiles
        note: >-
          Primary (all VAL, stride_clips 1, frame stride 8): n=1896 sit-gate frames;
          floor_tail p90=0.3334 m (n=389); seat_band p10=0.5307 m (n=1162); midpoint=0.4321 m.
          Frozen 0.43 m is within 0.002 m of this midpoint and kept as policy.
          derive_geometry_thresholds subsample (every 3rd clip): n=598; midpoint=0.402 m.
      yoga_pelvis_h_max:
        type: anchor
        note: low non-upright residual
      yoga_torso_up_min:
        type: anchor
        note: between lie and upright

tune:
  seed: 0
  fraction: 0.05

output:
  splits_json: results/E/splits.json
  floor_work_csv: results/E/floor_work_clips.csv
  cohort_counts_json: results/E/cohort_counts.json
