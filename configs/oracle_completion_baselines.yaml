# Track E3 — oracle completion baselines (control path only; docs/e3_oracle.md).
# Evidence (camera, noise, occlusion) is read from paths.ego_observation_yaml (E2-A), not duplicated here.
seed: 0
eval_noise_seed: 1

disclaimer: >-
  oracle control; floor height given (world z = 0); head pose and gravity given (D1)

window:
  length: 64
  stride: 32

# Heuristic: offsets from the neutral locked_head rest skeleton (betas 0, symmetrised, arms
# hanging), applied in the heading frame; nothing fitted to data (docs/e3_oracle.md).
heuristic:
  heading_min_horiz: 0.15   # |look_xy| below this -> heading fallback chain

# EgoCompleteMotion at HR-Refine width (configs/hr_refine.yaml model block).
model:
  d_model: 256
  n_heads: 8
  n_layers: 4
  ff_dim: 512
  dropout: 0.1
  max_len: 64

loss:
  w_geodesic: 1.0
  w_transl: 1.0   # metres, L1
  w_joints: 2.0   # metres, mean per-joint L2 (neutral-shape FK)
  w_contact: 0.3
  w_phys: 0.0     # E7 "none" arm: no physics loss in E3

train:
  batch_size: 64
  lr: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 1000
  max_steps: 40000
  grad_clip: 1.0
  bf16: true
  z_rot_max_rad: 3.141592653589793  # uniform heading augmentation; train only
  num_workers: 12
  log_every: 100
  val_every: 2000
  checkpoint_dir: null  # default <data_root>/checkpoints/e3_oracle

# Model selection: VAL only, cohorts all + ordinary_locomotion (never floor-work, never TEST).
selection:
  n_val_clips: 200
  cohorts: [all, ordinary_locomotion]
  metric: mean of pooled MPJPE (mm) over the two cohorts

preflight:
  overfit_steps: 300
  resume_steps: 20
  benchmark_steps: 60

memmap:
  rel_dir: e3_motion_30hz
  verify_n_clips: 100
  build_workers: 12

eval:
  ground_consistency_tolerance_m: 0.04947  # primary, frozen (docs/e0_audit.md)
  # Sensitivity column: same rule on singly grounded foot_traj heights (docs/pivot_log.md 2026-10-07).
  ground_consistency_tolerance_sensitivity_m: 0.04453
  contact_threshold: 0.5
  bootstrap_n: 2000
  bootstrap_seed: 0
  cohorts: [all, ordinary_locomotion, floor_work_eligible, sit_floor, sit_support]

heuristic_check:
  n_clips: 50          # seeded VAL clips with ordinary_locomotion frames
  rotations_deg: [37.0, 90.0, 200.0]

leak_check:
  max_tries: 300

paths:
  splits_json: results/E/splits.json
  floor_work_csv: results/E/floor_work_clips.csv
  ego_observation_yaml: configs/ego_observation.yaml
  ego_splits_yaml: configs/ego_splits.yaml
  ego_splits_doc: docs/ego_splits.md
  results_json: results/E/e3_oracle_run.json
