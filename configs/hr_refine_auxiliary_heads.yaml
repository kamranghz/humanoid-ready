# HR-Refine auxiliary heads (foot contact, BABEL action, root-translation intent) and the IMU fusion ablation.
# Data paths: configs/paths.yaml only. Windows come from the grounded_motion_30hz cache.
seed: 0
window: 64
observed_frames: 49      # intent head sees only these; it predicts the next intent_horizon frames
intent_horizon: 15
batch_size: 8
lr: 3.0e-4
weight_decay: 0.01
warmup_steps: 20
grad_clip_norm: 1.0
max_steps: 2000
log_every: 100
eval_every: 500
eval_windows: 256          # contact, intent and refinement metrics (random val windows)
eval_action_windows: 256   # action metrics (val windows from BABEL-labelled clips only)
eval_batch: 32
labeled_fraction: 0.5      # share of training windows drawn from BABEL-labelled clips
imu_noise_std: 0.5         # m/s^2 added to the kinematic accelerometer, train and eval
imu_dim: 18                # 6 sensors x 3 axes
contact_channels: 4
bf16: true

model:
  d_model: 256
  n_heads: 8
  n_layers: 4
  ff_dim: 512
  dropout: 0.1

corruption:
  rot_jitter_std_rad: 0.018
  root_trans_std_m: 0.035
  foot_sink_m: 0.025
  kp_noise_px: 3.0
  frame_dropout_prob: 0.03
  joint_dropout_prob: 0.05
  kp_dropout_prob: 0.08

# Multi-task weights (not tuned). Refinement keeps the weights of configs/hr_refine.yaml; no physics loss here.
loss:
  recon_joint: 1.0
  recon_rot: 0.1
  contact: 0.05
  action: 0.02
  intent: 0.5

# IMU fusion ablation: what the encoder is given besides the corrupted pose.
conditions:
  video_only: {video: true, imu: false}
  imu_only: {video: false, imu: true}
  fused: {video: true, imu: true}

checkpoint_dir: results/auxiliary_heads
