# HR-Refine training (checklist item 7). Data paths: configs/paths.yaml only.
seed: 0
window: 64
batch_size: 8
lr: 3.0e-4
weight_decay: 0.01
max_steps: 10000
log_every: 50
save_every: 500
bf16: true

model:
  d_model: 256
  n_heads: 8
  n_layers: 4
  ff_dim: 512
  dropout: 0.1

# Online corruption (item 7). Root-relative MPJPE hides pure translation; see corruption_metrics_table.
corruption:
  rot_jitter_std_rad: 0.018
  root_trans_std_m: 0.035
  foot_sink_m: 0.025
  kp_noise_px: 3.0
  frame_dropout_prob: 0.03
  joint_dropout_prob: 0.05
  kp_dropout_prob: 0.08

loss:
  recon_joint: 1.0
  recon_rot: 0.1
  physics: 0.001

# Jerk/flight on corrupted inputs can be O(1e8); refine targets contact/penetration/skating first.
physics_loss:
  smoothness:
    enabled: false
  flight_consistency:
    enabled: false

checkpoint_dir: results/A2/hr_refine
