[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hready"
version = "0.1.0"
description = "HumanoidReady: human video to physically verified, humanoid-ready motion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
ml = [
    "torch",
    "numpy",
    "scipy",
    "smplx",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hready*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
