[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hready"
version = "0.1.0"
description = "HumanoidReady: egocentric full-body human motion estimation with physical-plausibility evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
ml = [
    "torch",
    "numpy",
    "scipy",
    "smplx",
]
viz = [
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hready*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
"hready/robot/isaaclab_newton.py" = ["E402", "I001"]
