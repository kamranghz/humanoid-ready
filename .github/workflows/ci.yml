name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e .
      - name: Import smoke check
        run: python -c "import hready"
      - name: Ruff (pinned)
        run: |
          pip install ruff==0.16.10
          # Whole repo: syntax errors and undefined names only (older modules predate the full rule set).
          ruff check --select E9,F63,F7,F82 .
          # Completion modules: full project rule set.
          ruff check hready/data/completion_clips.py hready/data/completion_windows.py hready/data/ego_heading.py \
            hready/data/motion_cache.py hready/baselines hready/experiments hready/metrics/completion_metrics.py \
            hready/models/ego_complete_motion.py hready/train/completion_engine.py \
            hready/data/occlusion_cache.py hready/models/evidence_locked_completion.py hready/train/evidence_locked_engine.py \
            hready/metrics/paired_bootstrap.py tests
      - name: Unit tests (numpy only, no data or body models)
        run: |
          pip install -e ".[dev]" numpy
          pytest -q
